# Baut die macOS-Version von Smoky auf einem macOS-Runner und hängt die
# Artefakte an eine GitHub-Release an. Auslöser:
#   - manuell (workflow_dispatch, wähle Release-Tag)
#   - automatisch, sobald ein Tag vX.Y.Z gepusht wird
name: Mac Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag, an den die Mac-Artefakte angehängt werden (z. B. v1.13.5). Leer = neues Release aus package.json-Version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (.icns)
        run: node scripts/make-icns.js

      - name: Build macOS app (dmg + zip)
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.release.outputs.tag }}" --title "Smoky v${{ steps.version.outputs.version }}" --generate-notes
          gh release upload "${{ steps.release.outputs.tag }}" dist/Smoky-*-mac.zip dist/Smoky-*.dmg --clobber
          echo "Mac-Artefakte an ${{ steps.release.outputs.tag }} angehängt:"
          gh release view "${{ steps.release.outputs.tag }}" --json assets -q '.assets[].name'
