# Baut die macOS-Version von Smoky auf einem macOS-Runner und veröffentlicht
# die Artefakte (DMG + ZIP) als GitHub-Release. Auslöser:
#   - manuell (workflow_dispatch, wähle Release-Tag)
#   - automatisch, sobald ein Tag vX.Y.Z gepusht wird
name: Mac Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag, an den die Mac-Artefakte angehängt werden (z. B. v1.13.4). Leer = neues Release aus package.json-Version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (.icns)
        run: node scripts/make-icns.js

      - name: Determine release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + publish macOS app (dmg + zip)
        run: npx electron-builder --mac --publish always -c.publish.provider=github -c.publish.releaseType=release -c.publish.tag=${{ steps.release.outputs.tag }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Mac-Artefakte an ${{ steps.release.outputs.tag }}:"
          gh release view "${{ steps.release.outputs.tag }}" --json assets -q '.assets[].name'
