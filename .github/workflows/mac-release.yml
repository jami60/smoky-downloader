# Baut die macOS-Version von Smoky auf einem macOS-Runner und hängt die
# Artefakte (DMG + ZIP) an eine GitHub-Release an — neu oder bestehend.
# Auslöser:
#   - manuell (workflow_dispatch, wähle Release-Tag)
#   - automatisch, sobald ein Tag vX.Y.Z gepusht wird
name: Mac Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag, an den die Mac-Artefakte angehängt werden (z. B. v1.13.4). Leer = neues Release aus package.json-Version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (.icns)
        run: node scripts/make-icns.js

      - name: Determine release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS app (dmg + zip)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Smoky $TAG" --generate-notes
          gh release upload "$TAG" dist/Smoky-*-mac.zip dist/Smoky-*.dmg --clobber
          echo "Mac-Artefakte an $TAG angehängt:"
          gh release view "$TAG" --json assets -q '.assets[].name'
